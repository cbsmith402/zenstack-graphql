name: Publish to npm

on:
  release:
    types:
      - published
      - edited
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  update-changelog:
    if: github.event_name == 'release' && github.event.release.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update changelog from release notes
        run: node scripts/update-changelog-from-release.mjs
        env:
          CHANGELOG_PATH: CHANGELOG.md
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at || github.event.release.created_at }}

      - name: Commit changelog update
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already matches release notes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${{ github.event.release.tag_name }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}

  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'published'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/nextjs-demo/package-lock.json
            examples/express-demo/package-lock.json
            examples/hono-demo/package-lock.json
            examples/tanstack-start-demo/package-lock.json
            
      - run: npm install -g npm@latest

      - name: Install root dependencies
        run: npm ci

      - name: Verify package
        run: npm run ci:check

      - name: Ensure release tag matches package version
        if: github.event_name == 'release'
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package.json version v$PACKAGE_VERSION"
            exit 1
          fi

      - name: Publish package
        run: npm publish
